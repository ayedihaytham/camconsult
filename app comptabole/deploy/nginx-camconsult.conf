# /etc/nginx/sites-available/camconsult.com.tn
# Puis :  ln -s /etc/nginx/sites-available/camconsult.com.tn /etc/nginx/sites-enabled/
#         nginx -t && systemctl reload nginx
# (Certbot ajoutera automatiquement les blocs HTTPS 443 + les redirections.)
#
# Routage du domaine — deux applications séparées, un seul VPS :
#   camconsult.com.tn / www  → site vitrine Next.js (camconsult/, PM2 "camconsult-site", :3000)
#   cabinet.camconsult.com.tn → app comptable (app comptabole/, PM2 "app-comptable", :5181)

server {
    listen 80;
    listen [::]:80;
    server_name camconsult.com.tn www.camconsult.com.tn;

    access_log /var/log/nginx/camconsult-site.access.log;
    error_log  /var/log/nginx/camconsult-site.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name cabinet.camconsult.com.tn;

    # Import de fichiers (dataUrl base64 ≤ 2 Mo + marge)
    client_max_body_size 15M;

    access_log /var/log/nginx/app-comptable.access.log;
    error_log  /var/log/nginx/app-comptable.error.log;

    location / {
        proxy_pass http://127.0.0.1:5181;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
