<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CamConsult — Daily Workspace final · design</title>
    <style>
      :root {
        --navy: #0b2545;
        --gold: #c9a96a;
        --paper: #f8f7f4;
        --ink: #202b39;
        --muted: #5d6978;
        --rule: #e3e0d9;
        --red: #b52323;
        --amber: #995206;
        --green: #087957;
        --white: #fff;
        --soft: #eeefec;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        color: var(--ink);
        background: #e8e7e2;
        font-synthesis: none;
        font-size: 14px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button,
      a,
      input,
      select {
        touch-action: manipulation;
      }
      button {
        cursor: pointer;
      }
      button {
        color: inherit;
      }
      a {
        color: var(--navy);
        text-decoration: none;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      summary:focus-visible {
        outline: 3px solid var(--gold);
        outline-offset: 3px;
      }
      ::selection {
        background: #ead8b3;
        color: var(--navy);
      }
      input {
        caret-color: var(--navy);
      }
      button:disabled {
        cursor: default;
        opacity: 0.45;
      }
      .svg {
        width: 19px;
        height: 19px;
        flex-shrink: 0;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 28px;
        line-height: 1.18;
        letter-spacing: -0.035em;
      }
      h2 {
        font-size: 18px;
        letter-spacing: -0.015em;
        line-height: 1.35;
      }
      h3 {
        font-size: 14px;
      }
      small,
      .small {
        font-size: 12px;
      }
      .muted {
        color: var(--muted);
      }
      .num {
        font-variant-numeric: tabular-nums;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
      .reviewbar {
        background: #fff;
        border-bottom: 1px solid #d4d1ca;
        padding: 10px 22px;
        display: flex;
        gap: 20px;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
      }
      .review-id {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .review-id strong {
        font-size: 13px;
        letter-spacing: 0.02em;
      }
      .demo {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.075em;
        color: #61553b;
        background: #f4ebd8;
        padding: 6px 8px;
        border: 1px solid #ded0b2;
      }
      .review-links {
        display: flex;
        gap: 4px;
      }
      .review-links a {
        height: 38px;
        display: flex;
        align-items: center;
        padding: 0 12px;
        color: var(--muted);
        font-size: 12px;
      }
      .review-links a[aria-current] {
        background: var(--navy);
        color: white;
        border-radius: 4px;
      }
      .review-controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .review-controls select {
        height: 38px;
        padding: 0 28px 0 10px;
        border: 1px solid var(--rule);
        border-radius: 4px;
        background: white;
        color: var(--navy);
        max-width: 180px;
      }
      .device {
        display: flex;
        border: 1px solid var(--rule);
        border-radius: 4px;
      }
      .device button {
        border: 0;
        background: white;
        width: 40px;
        height: 36px;
        display: grid;
        place-items: center;
      }
      .device button[aria-pressed="true"] {
        background: #eeefec;
        color: var(--navy);
      }
      .review-caption {
        max-width: 1680px;
        margin: 12px auto;
        padding: 0 22px;
        font-size: 12px;
        color: #536070;
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      .review-caption a {
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .stage {
        max-width: 1680px;
        margin: 0 auto 20px;
        container-type: inline-size;
        container-name: workspace;
        background: var(--paper);
        min-height: calc(100vh - 115px);
        box-shadow: 0 6px 26px #0b254510;
      }
      .stage.phone {
        width: 390px;
        max-width: 100%;
        border: 1px solid #bbb8b1;
        border-radius: 16px;
        overflow: hidden;
      }
      .app {
        display: grid;
        grid-template-columns: 224px minmax(0, 1fr);
        min-width: 0;
      }
      .sidebar {
        background: var(--navy);
        color: #c1cbd7;
        min-height: calc(100vh - 115px);
        padding: 22px 14px;
        display: flex;
        flex-direction: column;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #fff;
        font-size: 13px;
        font-weight: 750;
        letter-spacing: 0.16em;
        padding: 0 8px 24px;
        border-bottom: 1px solid #ffffff22;
        margin-bottom: 20px;
      }
      .brand .svg {
        color: var(--gold);
      }
      .nav-group {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        color: #9dafc3;
        padding: 22px 10px 8px;
      }
      .nav-link {
        width: 100%;
        border: 0;
        background: transparent;
        color: inherit;
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 11px 10px;
        text-align: left;
        font-size: 13px;
        border-radius: 5px;
      }
      .nav-link:hover {
        background: #ffffff0b;
      }
      .nav-link.active {
        background: #ffffff13;
        color: #fff;
        box-shadow: inset 1px 0 var(--gold);
      }
      .nav-link .svg {
        width: 17px;
        height: 17px;
      }
      .nav-foot {
        margin-top: auto;
        padding: 24px 10px 0;
        font-size: 11px;
        color: #93a8c1;
      }
      .workspace {
        min-width: 0;
      }
      .topbar {
        height: 64px;
        background: #fff;
        border-bottom: 1px solid var(--rule);
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 24px;
        gap: 12px;
      }
      .topbar-left,
      .topbar-right {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
      }
      .topbar-left strong {
        font-weight: 600;
        font-size: 14px;
      }
      .topbar-left > .svg {
        color: var(--muted);
      }
      .topbar-left strong:before {
        content: "";
        display: inline-block;
        height: 18px;
        border-left: 1px solid var(--rule);
        vertical-align: middle;
        margin-right: 16px;
      }
      .user {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .avatar {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        flex-shrink: 0;
        border-radius: 50%;
        background: var(--navy);
        color: var(--gold);
        font-size: 11px;
        font-weight: 700;
      }
      .user strong {
        display: block;
        font-size: 12px;
      }
      .user small {
        display: block;
        color: var(--muted);
        margin-top: 3px;
        font-size: 11px;
      }
      .iconbutton {
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        display: grid;
        place-items: center;
        color: var(--muted);
      }
      .iconbutton:hover {
        background: var(--paper);
      }
      .mobile-help {
        display: none;
      }
      .help {
        display: flex;
        align-items: center;
        gap: 7px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        min-height: 44px;
        padding: 0 10px;
        font-size: 12px;
        color: var(--navy);
      }
      .content {
        padding: 22px 26px 36px;
        min-width: 0;
      }
      .banner {
        position: relative;
        background: var(--navy);
        color: #fff;
        border-radius: 7px;
        overflow: hidden;
        padding: 22px 24px;
      }
      .banner-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        position: relative;
        z-index: 1;
      }
      .banner p {
        color: #c4d0df;
        font-size: 13px;
        margin-top: 7px;
        line-height: 1.5;
      }
      .banner .greeting {
        font-size: 12px;
        margin: 0 0 7px;
        color: #c4d0df;
      }
      .banner .date {
        color: #dfc592;
        font-size: 12px;
        white-space: nowrap;
      }
      .banner h1 {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .banner h1 .svg {
        width: 21px;
        height: 21px;
        color: #d4dfec;
      }
      .banner:after {
        content: "";
        position: absolute;
        right: 0;
        top: 0;
        width: 34%;
        height: 100%;
        opacity: 0.07;
        background:
          linear-gradient(
            90deg,
            transparent 49.5%,
            white 50%,
            transparent 50.5%
          ),
          linear-gradient(transparent 49%, white 50%, transparent 51%);
        background-size:
          54px 100%,
          100% 36px;
        pointer-events: none;
      }
      .gold-rule {
        height: 1px;
        background: #ffffff25;
        margin-top: 17px;
        position: relative;
      }
      .gold-rule:after {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        width: 42%;
        height: 1px;
        background: var(--gold);
      }
      .button {
        min-height: 44px;
        border: 1px solid var(--rule);
        background: #fff;
        border-radius: 5px;
        padding: 0 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }
      .button:hover {
        background: #f1f0ec;
      }
      .button.inverse {
        border-color: #a88d58;
        background: #ffffff08;
        color: #fff;
      }
      .button.inverse:hover {
        background: #ffffff14;
      }
      .button.primary {
        background: var(--navy);
        border-color: var(--navy);
        color: #fff;
      }
      .button .svg {
        width: 16px;
        height: 16px;
      }
      .textlink {
        border: 0;
        background: transparent;
        min-height: 44px;
        padding: 0;
        font-size: 12px;
        font-weight: 600;
        color: var(--navy);
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .textlink .svg {
        width: 15px;
        height: 15px;
      }
      .textlink:hover {
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        border-bottom: 1px solid var(--rule);
        margin: 0 0 20px;
      }
      .metric {
        border: 0;
        border-right: 1px solid var(--rule);
        background: transparent;
        text-align: left;
        padding: 18px 18px 16px;
        display: grid;
        grid-template-columns: 1fr auto;
        column-gap: 8px;
        min-width: 0;
      }
      .metric:first-child {
        padding-left: 0;
      }
      .metric:last-child {
        border-right: 0;
      }
      .metric:hover {
        background: #eeefeb;
      }
      .metric strong {
        font-size: 24px;
        font-weight: 650;
        line-height: 1.1;
        letter-spacing: -0.02em;
        color: var(--navy);
      }
      .metric span {
        grid-column: 1;
        font-size: 12px;
        margin-top: 5px;
        color: var(--muted);
      }
      .metric .svg {
        grid-row: 1/3;
        grid-column: 2;
        width: 15px;
        height: 15px;
        align-self: center;
        color: #89929c;
      }
      .metric.danger strong {
        color: var(--red);
      }
      .lens-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin: 19px 0 12px;
      }
      .scope {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
      }
      .scope select {
        background: transparent;
        color: var(--navy);
        border: 0;
        border-bottom: 1px solid #b6bdc6;
        padding: 8px 24px 8px 4px;
        min-height: 44px;
        font-weight: 600;
        max-width: 220px;
      }
      .scope-label {
        color: var(--navy);
        font-weight: 600;
      }
      .tabs {
        display: flex;
        align-items: center;
        gap: 24px;
        border-bottom: 1px solid var(--rule);
        overflow: auto;
        scrollbar-width: thin;
        scrollbar-color: var(--gold) transparent;
      }
      .tabs button {
        position: relative;
        min-height: 48px;
        background: transparent;
        border: 0;
        color: var(--muted);
        white-space: nowrap;
        padding: 0 1px;
        font-size: 13px;
      }
      .tabs button[aria-selected="true"] {
        color: var(--navy);
        font-weight: 650;
      }
      .tabs button[aria-selected="true"]:after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: var(--gold);
      }
      .tabs button:hover {
        color: var(--navy);
      }
      .panel {
        margin-top: 22px;
        min-width: 0;
      }
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 0 0 14px;
      }
      .section-head p {
        color: var(--muted);
        font-size: 12px;
        margin-top: 5px;
        line-height: 1.5;
      }
      .section-head h2 .count {
        font-size: 13px;
        font-weight: 500;
        color: var(--muted);
        margin-left: 8px;
      }
      .surface {
        background: #fff;
        border: 1px solid var(--rule);
        border-radius: 5px;
        min-width: 0;
        overflow: hidden;
      }
      .ledger-head {
        padding: 16px 18px;
        border-bottom: 1px solid var(--rule);
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
      }
      .ledger-head p {
        font-size: 12px;
        color: var(--muted);
        margin-top: 5px;
      }
      .toolbar {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 12px 18px;
        border-bottom: 1px solid var(--rule);
        flex-wrap: wrap;
      }
      .search {
        display: flex;
        align-items: center;
        gap: 8px;
        background: #fff;
        border: 1px solid #d8d5ce;
        border-radius: 4px;
        padding: 0 11px;
        max-width: 420px;
        flex: 1;
        min-width: 180px;
        height: 44px;
      }
      .search .svg {
        color: var(--muted);
        width: 17px;
        height: 17px;
      }
      .search input {
        border: 0;
        outline: none;
        background: transparent;
        min-width: 0;
        width: 100%;
        height: 42px;
        color: var(--navy);
        font-size: 12px;
      }
      .search:focus-within {
        outline: 2px solid var(--gold);
        outline-offset: 1px;
      }
      .search input:focus-visible {
        outline: none;
      }
      .search input::placeholder {
        color: #697281;
      }
      .filters {
        display: flex;
        gap: 3px;
        flex-wrap: wrap;
      }
      .filters button {
        border: 0;
        background: transparent;
        padding: 0 11px;
        min-height: 44px;
        color: var(--muted);
        font-size: 12px;
      }
      .filters button[aria-pressed="true"] {
        background: #eeefec;
        border-radius: 4px;
        color: var(--navy);
        font-weight: 650;
      }
      .group-label {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #5a6574;
        padding: 13px 18px 8px;
        background: #fbfaf8;
        border-bottom: 1px solid var(--rule);
        display: flex;
        justify-content: space-between;
      }
      .queue {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .queue-row {
        display: grid;
        grid-template-columns: 36px minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        padding: 15px 18px;
        border-bottom: 1px solid var(--rule);
        min-height: 81px;
      }
      .queue-row:last-child {
        border-bottom: 0;
      }
      .queue-row:hover {
        background: #faf9f6;
      }
      .queue-icon {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        color: var(--navy);
        background: #eeefec;
        border-radius: 4px;
      }
      .queue-icon.red {
        color: var(--red);
        background: #fceeee;
      }
      .queue-icon.amber {
        color: var(--amber);
        background: #fcf2e5;
      }
      .row-copy {
        min-width: 0;
      }
      .row-title {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        line-height: 1.4;
        font-weight: 650;
        font-size: 13px;
        color: var(--navy);
      }
      .row-desc {
        font-size: 12px;
        color: var(--muted);
        margin-top: 5px;
        line-height: 1.5;
      }
      .row-meta {
        font-size: 11px;
        color: var(--muted);
        margin-top: 5px;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 10px;
        font-weight: 600;
        white-space: nowrap;
        color: #536171;
      }
      .status:before {
        content: "";
        width: 5px;
        height: 5px;
        border-radius: 1px;
        background: currentColor;
      }
      .status.red {
        color: var(--red);
      }
      .status.amber {
        color: var(--amber);
      }
      .status.green {
        color: var(--green);
      }
      .row-action {
        border: 0;
        background: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        min-height: 44px;
        min-width: 44px;
        color: var(--navy);
        font-size: 12px;
        font-weight: 600;
        padding: 0 4px;
      }
      .row-action .svg {
        width: 17px;
        height: 17px;
      }
      .row-action:hover {
        background: #eeefec;
        border-radius: 4px;
      }
      .ledger-footer {
        border-top: 1px solid var(--rule);
        padding: 10px 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        font-size: 11px;
        color: var(--muted);
      }
      .a-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 284px;
        gap: 22px;
        align-items: start;
      }
      .rail {
        min-width: 0;
      }
      .rail-section {
        border-top: 2px solid var(--navy);
        padding: 15px 0 18px;
      }
      .rail-section h2 {
        font-size: 16px;
      }
      .rail-section > .muted {
        font-size: 12px;
        margin-top: 5px;
        line-height: 1.5;
      }
      .date-block {
        display: flex;
        gap: 13px;
        align-items: center;
        margin: 17px 0;
      }
      .date-tile {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-width: 50px;
        border: 1px solid #d7d3c9;
        border-radius: 4px;
        background: white;
        padding: 8px;
      }
      .date-tile strong {
        font-size: 23px;
        line-height: 1.2;
        color: var(--navy);
        font-weight: 650;
      }
      .date-tile small {
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-size: 10px;
        color: var(--muted);
      }
      .date-block p {
        font-size: 12px;
        line-height: 1.6;
      }
      .subrow {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 13px 0;
        border-bottom: 1px solid var(--rule);
      }
      .subrow:last-child {
        border-bottom: 0;
      }
      .subrow .svg {
        color: var(--muted);
        width: 17px;
        height: 17px;
        margin-top: 2px;
      }
      .subrow strong {
        font-size: 12px;
        display: block;
        color: var(--navy);
        line-height: 1.45;
      }
      .subrow p {
        font-size: 11px;
        color: var(--muted);
        line-height: 1.6;
        margin-top: 3px;
      }
      .subrow .textlink {
        margin-left: auto;
        min-width: 44px;
      }
      .subrow .textlink .svg {
        color: var(--navy);
      }
      .work-totals {
        display: flex;
        gap: 20px;
        margin-top: 16px;
      }
      .work-totals strong {
        font-size: 23px;
        color: var(--navy);
        display: block;
      }
      .work-totals small {
        font-size: 11px;
        color: var(--muted);
      }
      .empty {
        padding: 44px 20px;

        line-height: 1.6;

        color: var(--navy);

      ? skeleton("Chargement des éléments à traiter…")
      : items.length
        ? groups
            .map(([key, label]) => {
              const rows = items.filter((i) => i.group === key);
              return rows.length
                ? `<div class="group-label"><span>${label}</span><span>${rows.length}</span></div>${queueRows(rows)}`
                : "";
            })
            .join("")
        : `<div class="empty"><strong>${state.query || state.filter !== "all" ? "Aucun élément correspondant" : d.collectionState === "error" ? "Aucun autre élément disponible" : "Aucun élément à traiter dans ce périmètre"}</strong>${state.query || state.filter !== "all" ? "Essayez une autre recherche ou affichez tous les types." : d.collectionState === "error" ? "Les collectes restent à charger. Réessayez pour connaître les échéances et corrections." : "Vous pouvez reprendre votre travail ou consulter les collectes."}</div>`
  }${state.scenario === "loading" ? "" : `<div class="ledger-footer"><span>${countLabel(items.length, "élément")} ${d.collectionState === "error" ? "disponibles" : "affichés"}</span><span>Groupés par besoin d’action</span></div>`}</div>`;
}
function attention(d) {
  return (
    panelHead(
      "À traiter",
      "Échéances de collecte, corrections, dossiers à examiner et échanges non lus.",
    ) +
    `<section class="attention-panel" data-tour="dashboard-attention">${toolbar()}${groupedQueue(d)}</section>`
  );
}
function work(d) {
  const filter = state.taskFilter;
  const groups =
    filter === "done"
      ? [["termine", "Terminées"]]
      : [
          ["en_cours", "En cours"],
          ["a_faire", "À faire"],
        ];
  return (
    panelHead(
      state.role === "admin" ? "Tâches du périmètre" : "Mes tâches",
      "Le travail est regroupé par statut. Les tâches n’ont pas de date limite.",
    ) +
    `<div class="view-summary"><div class="filters" aria-label="État des tâches"><button data-task-state="open" aria-pressed="${filter === "open"}">Ouvertes</button><button data-task-state="done" aria-pressed="${filter === "done"}">Terminées</button><button class="textlink" data-open="/taches" data-title="Tâches">Ouvrir les tâches${icon("arrow")}</button></div></div><section data-tour="dashboard-tasks">${
      !d.taskReady
        ? skeleton("Chargement des tâches…")
        : groups
            .map(([status, title]) => {
              const rows = taskRows(d, status);
              return `<section class="docket-group"><div class="docket-head"><h3>${title}</h3><small>${countLabel(rows.length, "tâche")}</small></div>${rows.length ? queueRows(rows) : '<p class="date-empty">Aucune tâche dans ce groupe.</p>'}</section>`;
            })
            .join("")
    }</section>`
  );
}
function deadlines(d) {
  const groups = [
    ["overdue", "En retard"],
    ["today", "Aujourd’hui"],
    ["week", "7 prochains jours"],
    ["later", "Plus tard"],
  ];
  return (
    panelHead(
      "Échéances des collectes",
      "Dates de transmission des dossiers ouverts. Les collectes validées ou archivées sont exclues.",
    ) +
    `<div class="deadline-content" data-tour="dashboard-transmissions">${
      !isCollectionReady(d)
        ? unavailable(d)
        : d.cs.length
          ? groups
              .map(([key, title]) => {
                const cs = d.cs
                  .filter((c) => bucket(c.due) === key)
                  .sort((a, b) => a.due.localeCompare(b.due));
                return cs.length
                  ? `<section class="deadline-group"><h3>${title} · ${cs.length}</h3>${cs.map(transmissionRow).join("")}</section>`
                  : "";
              })
              .join("")
          : '<p class="date-empty">Aucune échéance de collecte ouverte dans ce périmètre.</p>'
    }</div>`
  );
}
function activityView(d) {
  const types = [
    "Tout",
    "Fichier",
    "Message",
    ...(state.role === "admin" ? ["Journal"] : []),
  ];
  const rows =
    state.activity === "Tout"
      ? d.feed
      : d.feed.filter((a) => a.type === state.activity);
  return (
    panelHead(
      "Activité récente",
      "Les derniers éléments accessibles, pour retrouver ce qui a changé.",
    ) +
    `<div class="activity-content"><div class="activity-filter" aria-label="Filtrer l’activité">${types.map((t) => `<button data-activity="${t}" aria-pressed="${state.activity === t}">${t}</button>`).join("")}</div>${!d.activityReady ? skeleton("Chargement de l’activité…") : rows.length ? `<h3 class="small muted">30 septembre 2026</h3>${activityRows(rows)}` : '<p class="date-empty">Aucun élément récent de ce type dans votre périmètre.</p>'}<p class="activity-source-note">Aperçu limité aux derniers fichiers, conversations${state.role === "admin" ? " et événements du journal" : ""}. Ce n’est pas un historique complet.</p></div>`
  );
}
function render() {
  const d = data();
  shell();
  document.getElementById("role").value = state.role;
  document.getElementById("scenario").value = state.scenario;
  const body =
    state.view === "overview"
      ? overviewB(d)
      : state.view === "work"
        ? work(d)
        : state.view === "attention"
          ? attention(d)
          : state.view === "deadlines"
            ? deadlines(d)
            : state.view === "team" && state.role === "admin"
              ? d.taskReady
                ? team(d)
                : panelHead(
                    "Répartition des tâches",
                    "Volumes réels par statut, sans mesure de capacité.",
                  ) + skeleton("Chargement du travail de l’équipe…")
              : activityView(d);
  document.getElementById("content").innerHTML =
    banner(d) +
    metrics(d) +
    scope() +
    tabs() +
    `<div id="view-panel" data-tour="dashboard-work" class="panel" role="tabpanel" tabindex="0" aria-labelledby="tab-${state.view}">${partialStatus(d)}${body}</div><div class="endnote"><span>DEMO STRUCTURAL DATA · noms, chiffres et événements fictifs</span><span>Scénario fixé au 30/09/2026</span></div><div class="help-footer"><button class="help desktop-help" data-help>${icon("help")} Aide</button></div>`;
}
document.addEventListener("change", (event) => {
  if (event.target.id === "scenario") {
    state.scenario = event.target.value;
    state.query = "";
    state.filter = "all";
    render();
  }
});
document.addEventListener("click", (event) => {
  const b = event.target.closest("button");
  if (!b) return;
  if (b.dataset.scopeChoice) {
    state.scope =
      b.dataset.scopeChoice === "cabinet"
        ? "all"
        : state.scope === "all"
          ? "lina"
          : state.scope;
    render();
    document
      .querySelector(`[data-scope-choice="${b.dataset.scopeChoice}"]`)
      ?.focus({ preventScroll: true });
  }
  if (b.dataset.taskState) {
    state.taskFilter = b.dataset.taskState;
    render();
    document
      .querySelector(`[data-task-state="${state.taskFilter}"]`)
      ?.focus({ preventScroll: true });
  }
  if (b.hasAttribute("data-retry")) {
    state.scenario = "normal";
    render();
    document.getElementById("view-panel")?.focus({ preventScroll: true });
  }
});

      let toastTimer;
      function toast(message) {
        document.getElementById("toast").textContent = message;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(
          () => (document.getElementById("toast").textContent = ""),
          3500,
        );
      }
      document.addEventListener("click", (event) => {
        const b = event.target.closest("button");
        if (!b) return;
        if (b.hasAttribute("data-close")) {
          document.getElementById("dialog").close();
          return;
        }
        if (b.dataset.view) {
          changeView(b.dataset.view);
          return;
        }
        if (b.dataset.filter) {
          state.filter = b.dataset.filter;
          render();
          document
            .querySelector(`[data-filter="${state.filter}"]`)
            ?.focus({ preventScroll: true });
          return;
        }
        if (b.dataset.activity) {
          state.activity = b.dataset.activity;
          render();
          document
            .querySelector(`[data-activity="${state.activity}"]`)
            ?.focus({ preventScroll: true });
          return;
        }
        if (b.dataset.day) {
          state.day = b.dataset.day;
          render();
          document
            .querySelector(`[data-day="${state.day}"]`)
            ?.focus({ preventScroll: true });
          return;
        }
        if (b.dataset.device) {
          document
            .getElementById("stage")
            .classList.toggle("phone", b.dataset.device === "mobile");
          document
            .querySelectorAll("[data-device]")
            .forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
          return;
        }
        if (b.hasAttribute("data-help")) {
          openDialog(
            "Comprendre ce Dashboard",
            `<p><strong>${MODE === "a" ? "Commencez par les éléments à traiter." : MODE === "b" ? "Reprenez votre travail et consultez les transmissions attendues." : "Lisez la situation, puis ouvrez le dossier qui demande une action."}</strong></p><ul><li>Les échéances concernent uniquement les collectes ouvertes.</li><li>Les tâches sont à faire, en cours ou terminées. Elles n’ont pas de date limite.</li><li>Les messages non lus sont ceux de votre compte.</li><li>Les données restent dans le périmètre autorisé.</li></ul><p>Dans l’application, ce point d’entrée réutiliserait la visite guidée existante. Cette maquette présente uniquement l’organisation proposée.</p><div class="dialog-actions"><button class="button primary" data-close>Compris</button></div>`,
          );
          return;
        }
        if (b.hasAttribute("data-quick")) {
          openDialog(
            "Actions rapides",
            `<p>Ouvrir un espace de travail, sans multiplier les raccourcis.</p><div style="display:grid;gap:8px"><button class="button" data-open="/taches" data-title="${state.role === "admin" ? "Tâches" : "Mes tâches"}">${icon("tasks")}${state.role === "admin" ? "Voir les tâches" : "Mes tâches"}</button><button class="button" data-open="/collectes" data-title="Collectes">${icon("collecte")}Voir les collectes</button>${state.role === "admin" ? `<button class="button" data-open="/societes" data-title="Sociétés">${icon("building")}Gérer les sociétés</button>` : `<button class="button" data-open="/messagerie" data-title="Messagerie">${icon("message")}Ouvrir la messagerie</button>`}</div><p class="notice">Les créations restent dans leur module, avec leurs contrôles de permission.</p>`,
          );
          return;
        }
        if (b.hasAttribute("data-notifications")) {
          toast(
            "Les notifications restent accessibles dans la barre de navigation.",
          );
          return;
        }
        if (b.dataset.open) {
          destination(b.dataset.open, b.dataset.title || "Espace de travail");
        }
      });
      document.addEventListener("change", (event) => {
        if (event.target.id === "role") {
          state.role = event.target.value;
          state.scope = "all";
          state.view = "overview";
          state.activity = "Tout";
          state.query = "";
          state.filter = "all";
          render();
        }
        if (event.target.id === "scope") {
          state.scope = event.target.value;
          render();
        }
      });
      document.addEventListener("input", (event) => {
        if (event.target.id === "queue-search") {
          state.query = event.target.value;
          const d = data();
          const host = document.getElementById("queue-results");
          const wrapper = document.createElement("div");
          wrapper.innerHTML = groupedQueue(d);
          host.replaceWith(wrapper.firstElementChild);
        }
      });
      document.addEventListener("keydown", (event) => {
        if (!event.target.matches("[role=tab]")) return;
        const buttons = [...document.querySelectorAll("[role=tab]")];
        let idx = buttons.indexOf(event.target);
        if (event.key === "ArrowRight") idx = (idx + 1) % buttons.length;
        else if (event.key === "ArrowLeft")
          idx = (idx - 1 + buttons.length) % buttons.length;
        else if (event.key === "Home") idx = 0;
        else if (event.key === "End") idx = buttons.length - 1;
        else return;
        event.preventDefault();
        changeView(buttons[idx].dataset.view);
      });
      document.querySelector("[data-device=desktop]").innerHTML =
        icon("monitor");
      document.querySelector("[data-device=mobile]").innerHTML = icon("phone");
      document.querySelector("[data-close]").innerHTML = icon("close");
      render();
    </script>
  </body>
