name: Build & push app-comptable

on:
  push:
    branches: [main]
    paths:
      - "app comptabole/**"
      - ".github/workflows/app-comptable.yml"
  workflow_dispatch: {}

jobs:
  # Les contrôles qualité passent avant la construction de l'image : un test en échec bloque le déploiement.
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "./app comptabole"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "./app comptabole/package-lock.json"

      - run: npm ci
      - name: Types
        run: npm run lint
      - name: Tests
        run: npm test

  docker:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: "./app comptabole"
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/app-comptable:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/app-comptable:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
