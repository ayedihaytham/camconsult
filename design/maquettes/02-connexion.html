<title>Connexion cabinet circuit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap">
<style>
/* Disposition : une page d'aperçu avec trois maquettes de connexion interchangeables, en vue ordinateur ou mobile, entièrement jouables. Marine et or de l'application. */
:root{
  --navy:#0B2545;--navy-d:#071A33;--navy-m:#123560;--gold:#C9A96A;--gold-l:#E6D3A6;--ivory:#FEF4E8;--paper:#FCFBF8;--ink:#0B2545;--mute:#5B6F80;--ok:#246549;--okl:#9BCDB1;--err:#B3402A;--sky:#AAC5DF;
  --serif:'Playfair Display',Georgia,serif;--sans:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{background:#050D18;color:var(--ivory);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
.top{width:min(1200px,100%);margin-inline:auto;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;margin-bottom:20px}
.top h1{font-family:var(--serif);font-weight:500;font-size:1.5rem}
.top h1 em{color:var(--gold)}
.sw{display:inline-flex;gap:4px;padding:4px;border-radius:99px;background:#0D1B2D;border:1px solid #1B2E45}
.sw button{padding:8px 15px;border-radius:99px;font-size:.78rem;font-weight:600;color:#9FB1C0;transition:background .3s,color .3s}
.sw button[aria-pressed=true]{background:var(--gold);color:var(--navy)}
.ctl{display:flex;flex-wrap:wrap;gap:12px}
.hint{width:min(1200px,100%);margin:0 auto 14px;font-size:.78rem;color:#8FA3B5}
.hint b{color:var(--gold-l);font-weight:600}
.hint code{background:#0D1B2D;border:1px solid #1B2E45;padding:1px 7px;border-radius:6px;color:var(--ivory)}

/* ===== zone d'aperçu ===== */
.vp{container:vp/inline-size;position:relative;margin-inline:auto;width:min(1200px,100%);height:min(760px,calc(100svh - 150px));min-height:620px;border-radius:18px;overflow:hidden;background:var(--navy);box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px #1B2E45;transition:width .6s cubic-bezier(.2,.8,.2,1),height .6s cubic-bezier(.2,.8,.2,1),border-radius .5s}
.mob .vp{width:390px;max-width:100%;height:780px;border-radius:38px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 8px #101B2A,0 0 0 9px #26384C}
.scene{position:absolute;inset:0;display:none;overflow:hidden auto}
.s-b1{display:block}
.lg{height:34px;width:auto;display:block}

/* ===== formulaire commun ===== */
.fm{--ink:var(--navy);--mute:#5B6F80;--line:rgba(11,37,69,.3);--bg:var(--navy);--fg:var(--ivory);--ac:#A8884A;--errbg:rgba(179,64,42,.1);--errc:#B3402A;text-align:left}
.fm.dark{--ink:var(--ivory);--mute:#9FB1C0;--line:rgba(254,244,232,.3);--bg:var(--gold);--fg:var(--navy);--ac:var(--gold);--errbg:rgba(224,120,96,.14);--errc:#F0A08C}
.fm form{display:grid;gap:18px}.fm form[hidden]{display:none}
.fld label{display:block;font-size:.68rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ink)}
.row{display:flex;align-items:center;gap:10px;border-bottom:2px dashed var(--line);transition:border-color .3s}
.row:focus-within{border-color:var(--ac);border-bottom-style:solid}
.row svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--mute);transition:color .3s}
.row:focus-within>svg{color:var(--ink)}
.row input{flex:1;min-width:0;height:46px;background:none;border:0;outline:0;font-size:1rem;color:var(--ink)}
.row input::placeholder{color:var(--mute);opacity:.6}
.eye{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--mute)}.eye:hover{color:var(--ink)}
.eye svg{width:18px;height:18px}
.caps{display:flex;gap:8px;align-items:center;font-size:.76rem;font-weight:600;color:#B7791F;margin-top:-6px}.caps svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.dark .caps{color:#E7B25A}
.err{display:flex;gap:8px;align-items:center;padding:9px 12px;border-radius:8px;background:var(--errbg);color:var(--errc);font-size:.84rem}.err svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2}
.caps[hidden],.err[hidden]{display:none}
.err.shk{animation:shk .45s}
@keyframes shk{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.go{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:12px;height:50px;border-radius:99px;background:var(--bg);color:var(--fg);font-size:.8rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;transition:transform .2s,filter .3s}
.go:hover{filter:brightness(1.1)}.go:active{transform:translateY(1px)}
.go svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .4s cubic-bezier(.2,1.4,.3,1)}
.go:hover svg{transform:translateX(4px)}
.go::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--ac);transition:width .5s}.go:hover::after{width:100%}
.fm:not(.dark) .go::after{background:var(--gold)}
.go[disabled]{opacity:.7;pointer-events:none}
.go .sp{display:none;width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:rot .7s linear infinite}
.go.busy .sp{display:block}.go.busy svg{display:none}
@keyframes rot{to{transform:rotate(360deg)}}
.note{display:flex;gap:10px;font-size:.86rem;color:var(--mute);line-height:1.5}.note svg{width:16px;height:16px;flex:none;margin-top:3px;stroke:var(--ac);fill:none;stroke-width:1.8}
.code{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.code input{width:100%;height:56px;text-align:center;font-family:var(--serif);font-size:1.6rem;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);outline:0;transition:border-color .25s,transform .25s,background .25s}
.code input:focus{border-color:var(--ac);transform:translateY(-3px)}.code input.f{background:rgba(201,169,106,.16);border-color:var(--ac)}
.back{display:flex;align-items:center;gap:6px;justify-content:center;font-size:.84rem;color:var(--mute)}.back:hover{color:var(--ink)}
.back svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.hd{display:grid;justify-items:start;gap:6px}
.av{position:relative;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:var(--gold);box-shadow:0 0 0 5px rgba(201,169,106,.22);margin-bottom:8px}
.av span{font-family:var(--serif);font-size:1.25rem;font-weight:600;animation:pop .35s cubic-bezier(.2,.9,.3,1.4)}
.av svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;animation:sld 3.2s ease-in-out infinite}
.av::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid var(--gold);opacity:0;animation:wv 3s ease-out infinite}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@keyframes sld{50%{transform:translateX(3px)}}
@keyframes wv{0%{transform:scale(.8);opacity:.7}100%{transform:scale(1.35);opacity:0}}
.eb{font-size:.68rem;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--ac)}
.hd h2{font-family:var(--serif);font-weight:500;font-size:clamp(2rem,4.4cqi,2.7rem);line-height:1;color:var(--ink);text-wrap:balance}
.hd p{font-size:.9rem;color:var(--mute);line-height:1.5;max-width:40ch}
.hd small{font-size:.76rem;color:var(--mute);opacity:.8;text-transform:capitalize}

/* ===== succès commun ===== */
.win{position:absolute;inset:0;z-index:20;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;background:radial-gradient(60% 60% at 50% 45%,#1a3558,var(--navy-d));opacity:0;pointer-events:none;transition:opacity .8s var(--wd,.15s);padding:24px}
[data-step=ok] .win{opacity:1;pointer-events:auto}
.win svg.ck{width:96px;height:96px;overflow:visible}
.win circle{fill:none;stroke:var(--gold);stroke-width:2.5;stroke-dasharray:240;stroke-dashoffset:240;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1) calc(var(--wd,0s) + .3s)}
.win path{fill:none;stroke:var(--gold);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:54;stroke-dashoffset:54;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1) calc(var(--wd,0s) + 1.1s)}
[data-step=ok] .win circle,[data-step=ok] .win path{stroke-dashoffset:0}
.win h3{font-family:var(--serif);font-weight:500;font-size:2.1rem;opacity:0;transform:translateY(10px);transition:.6s calc(var(--wd,0s) + 1.2s)}
.win p{color:var(--sky);font-size:.9rem;opacity:0;transition:opacity .6s calc(var(--wd,0s) + 1.35s)}
[data-step=ok] .win h3,[data-step=ok] .win p{opacity:1;transform:none}
.win .bar{width:200px;height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.win .bar i{display:block;height:100%;width:100%;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform 2.4s cubic-bezier(.4,0,.2,1) calc(var(--wd,0s) + 1.4s)}
[data-step=ok] .win .bar i{transform:none}
.win button{margin-top:6px;font-size:.8rem;font-weight:700;color:var(--gold);text-decoration:underline;text-underline-offset:4px;opacity:0;transition:opacity .6s calc(var(--wd,0s) + 3.4s)}
[data-step=ok] .win button{opacity:1}
.rise{opacity:0;transform:translateY(18px);animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d,0s)}
@keyframes rise{to{opacity:1;transform:none}}


/* ===== communs ===== */
.sl{--ink:var(--navy);--mute:#5B6F80;--ac:#A8884A}
.scene{display:none;scrollbar-width:none}.scene::-webkit-scrollbar{display:none}.s-h{display:block}.s-h[data-step=ok]{overflow:hidden}
.hd small{display:none}
.pill{display:inline-flex;gap:8px;align-items:center;font:700 .64rem var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--gold-l)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--okl);box-shadow:0 0 8px var(--okl)}

/* ===== Circuit + bureau qui se dévoile ===== */
.s-h{background:#F4F3EF;--wd:2.8s}
.s-h .lay{min-height:100%;display:grid;grid-template-columns:1.3fr .7fr}
.s-h .hero{position:relative;overflow:hidden;background:radial-gradient(110% 90% at 12% 0%,#1a4580 0%,var(--navy) 55%,var(--navy-d) 100%);color:var(--ivory);padding:24px clamp(20px,3.2cqi,44px) 18px;display:grid;align-content:start;gap:16px}
.s-h .hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(254,244,232,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(254,244,232,.035) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(80% 80% at 30% 35%,#000,transparent);mask-image:radial-gradient(80% 80% at 30% 35%,#000,transparent)}
.s-h .hero>*{position:relative;z-index:1}
.s-h .tp{display:flex;justify-content:space-between;align-items:center}.s-h .tp img{height:30px;width:auto}
.s-h h1{font-family:var(--serif);font-weight:500;font-size:clamp(2rem,3.5cqi,2.9rem);line-height:1.04;max-width:16ch;text-wrap:balance}.s-h h1 em{color:var(--gold);font-style:italic}
.s-h .sub{margin-top:10px;color:#B9C9D8;font-size:.92rem;max-width:48ch;line-height:1.5}
.s-h .lanes{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.s-h .ln{border-radius:14px;border:1px solid rgba(254,244,232,.13);background:rgba(7,26,51,.5);padding:11px 9px;min-height:196px;display:grid;align-content:start;gap:8px;transition:border-color .5s,background .5s}
.s-h .ln h3{display:flex;justify-content:space-between;align-items:center;gap:6px;font:700 .6rem var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-l);margin-bottom:3px}
.s-h .ln h3 b{font-size:.6rem;padding:2px 7px;border-radius:99px;background:rgba(254,244,232,.1);color:var(--ivory)}
.s-h .ln.am h3{color:#E7B25A}.s-h .ln.ok h3{color:var(--okl)}
.s-h .gc{border-radius:10px;background:rgba(254,244,232,.08);padding:9px 10px;display:grid;gap:6px;font-size:.7rem;font-weight:600;color:#C4D2DF;filter:blur(5px);opacity:.55;transition:filter .9s,opacity .9s}
.s-h .gc i{display:block;height:4px;border-radius:4px;background:rgba(254,244,232,.12);position:relative;overflow:hidden}.s-h .gc i::after{content:"";position:absolute;inset:0;width:0;background:rgba(201,169,106,.7);transition:width 1.1s cubic-bezier(.2,.8,.2,1) .3s}
.s-h .lanes.lit .gc{filter:none;opacity:1}.s-h .lanes.lit .gc i::after{width:var(--w)}
.s-h .ln.hl{border-color:var(--gold);background:rgba(201,169,106,.09)}.s-h .ln.hl.am{border-color:#E7B25A;background:rgba(231,178,90,.09)}.s-h .ln.hl.ok{border-color:var(--okl);background:rgba(155,205,177,.1)}
.s-h .tk{position:absolute;left:0;top:0;width:calc((100% - 30px)/4 - 14px);z-index:3;border-radius:12px;background:linear-gradient(160deg,#FFF4D6,#E6C77A);color:var(--navy);padding:10px 11px;display:grid;gap:7px;box-shadow:0 18px 40px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.4) inset;transition:transform 1.1s cubic-bezier(.55,0,.2,1),background .6s;font-size:.7rem;font-weight:700}
.s-h .tk .who{display:flex;gap:8px;align-items:center}.s-h .tk .who i{width:26px;height:26px;border-radius:50%;background:var(--navy);color:var(--gold-l);display:grid;place-items:center;font:700 .6rem var(--sans);font-style:normal;flex:none}
.s-h .tk .who span{line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-h .tk .bar{height:5px;border-radius:5px;background:rgba(11,37,69,.18);overflow:hidden}.s-h .tk .bar::after{content:"";display:block;height:100%;width:calc(var(--o,0)*100%);background:var(--navy);border-radius:5px;transition:width .5s}
.s-h .tk small{font:700 .56rem var(--sans);letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.s-h .tk.er{background:linear-gradient(160deg,#FFE9C2,#E7B25A);animation:tshk .5s}.s-h .tk.vl{background:linear-gradient(160deg,#E3F3EA,#9BCDB1)}
@keyframes tshk{25%{rotate:-4deg}50%{rotate:3deg}75%{rotate:-2deg}}
.s-h .cl3{display:grid;grid-template-columns:1.3fr .85fr 1fr;gap:12px}
.s-h .cd{border-radius:14px;background:rgba(252,251,248,.97);color:var(--navy);box-shadow:0 18px 40px rgba(0,0,0,.3);padding:12px 14px;filter:blur(5px) saturate(.4);opacity:.7;transition:filter 1s,opacity 1s,outline-color .6s;outline:1.5px solid transparent;min-width:0}
.s-h .cd.lit{filter:none;opacity:1;outline-color:rgba(201,169,106,.95)}
.s-h .cd h4{font:700 .6rem var(--sans);letter-spacing:.18em;text-transform:uppercase;color:#5B6F80;margin-bottom:8px}
.s-h .c1 ul{list-style:none;padding:0;display:grid;gap:7px}.s-h .c1 li{display:grid;grid-template-columns:30px 1fr;gap:9px;align-items:center;font-size:.74rem;font-weight:600}
.s-h .c1 li b{display:grid;place-items:center;height:26px;border-radius:7px;background:var(--navy);color:var(--gold-l);font-family:var(--serif);font-size:.85rem}
.s-h .c1 li span{line-height:1.2}.s-h .c1 li em{display:block;font-style:normal;font-size:.62rem;color:#5B6F80}
.s-h .c3{display:grid;align-content:center;justify-items:start;gap:8px}
.s-h .ring{width:56px;height:56px}.s-h .ring circle{fill:none;stroke-width:6;stroke-linecap:round}.s-h .ring .t{stroke:#E4E1D8}.s-h .ring .v{stroke:var(--ok);stroke-dasharray:163;stroke-dashoffset:163;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1) .25s}
.s-h .lit .ring .v{stroke-dashoffset:23}
.s-h .c3 strong{display:block;font-family:var(--serif);font-weight:500;font-size:1.4rem;line-height:1}.s-h .c3 span{font-size:.66rem;font-weight:600;color:#5B6F80}
.s-h .mg{display:flex;gap:8px;align-items:center;font-size:.72rem;font-weight:600;padding:5px 0;line-height:1.2}.s-h .mg+.mg{border-top:1px dashed #DAD6CA}
.s-h .mg i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:var(--gold-l);font:700 .58rem var(--sans);font-style:normal;flex:none}
.s-h .fn{font-size:.68rem;color:#8FA3B5}
.s-h .fp{position:relative;display:grid;align-content:center;justify-items:center;padding:30px clamp(20px,3.4cqi,48px)}
.s-h .pn{width:min(360px,100%);display:grid;gap:14px}.s-h .pn .hd{margin-bottom:4px}.s-h .pn .hd .av{width:48px;height:48px}
.s-h .pn .hd h2{font-size:clamp(1.8rem,3.3cqi,2.3rem)}
.s-h[data-step=ok] .pn{animation:none;opacity:0;transform:translateX(18px);transition:.7s;pointer-events:none}
.s-h[data-step=ok] .cl3,.s-h[data-step=ok] .hero h1,.s-h[data-step=ok] .sub{opacity:0;transition:opacity .9s 1.1s}
.s-h[data-step=ok] .lanes{transform:scale(1.12);opacity:0;transition:transform 1.4s cubic-bezier(.6,0,.3,1) 1.3s,opacity 1s 1.6s}

@container vp (max-width:780px){
  .s-h .lay{grid-template-columns:1fr}
  .s-h .hero{padding:18px 14px;gap:12px}.s-h .sub,.s-h .fn{display:none}.s-h h1{font-size:1.8rem}
  .s-h .ln{min-height:118px;padding:9px 6px}.s-h .tk{gap:5px;padding:6px 7px}.s-h .tk .who span{font-size:.56rem}.s-h .gc{display:none}.s-h .ln h3{font-size:.5rem;letter-spacing:.06em;flex-direction:column;align-items:flex-start}
  .s-h .tk{width:calc((100% - 30px)/4 - 6px);font-size:.58rem;padding:7px}.s-h .tk .who i,.s-h .tk small{display:none}
  .s-h .cl3{scrollbar-width:none}.s-h .cl3::-webkit-scrollbar{display:none}
  .s-h .cl3{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-14px;padding:4px 14px 8px}.s-h .cd{flex:0 0 74%;scroll-snap-align:start}
  .s-h .fp{padding:22px 16px 30px;align-content:start}
  .win h3{font-size:1.8rem}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<div id="app" data-v="h" class="desk">
  <div class="top">
    <h1>La connexion, <em>circuit &amp; bureau</em></h1>
    <div class="ctl">
                  <div class="sw" role="group" aria-label="Appareil"><button type="button" data-d="desk" aria-pressed="true">Ordinateur</button><button type="button" data-d="mob" aria-pressed="false">Mobile</button></div>
    </div>
  </div>
  <p class="hint">Essayez : identifiant (<code>mohamed.ayedi</code>) + mot de passe, puis le code <code>123456</code>. Mot de passe <code>erreur</code> ou mauvais code : le dossier repart en « À corriger ». Tout est illustratif.</p>
  <div class="vp" id="vp"></div>
</div>

<script>
