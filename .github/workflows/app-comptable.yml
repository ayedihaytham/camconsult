name: Build & push app-comptable

on:
  push:
    branches: [main]
    paths:
      - "app comptabole/**"
      - ".github/workflows/app-comptable.yml"
  workflow_dispatch: {}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: "./app comptabole"
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/app-comptable:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/app-comptable:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
