.preview .review,.preview .demo-line{display:none}</style></head><body data-direction="b"><div class="review"><div class="review-title">B — Financial Desk <span class="muted">/ exploration de direction artistique</span></div><div class="review-controls"><a href="index.html">Comparer les directions</a><label>Rôle <select id="review-role"><option value="admin">Admin</option><option value="collaborator">Collaboratrice</option></select></label><label>État <select id="review-state"><option value="normal">Données disponibles</option><option value="empty">Sans travail</option><option value="loading">Collectes en chargement</option><option value="error">Échec des collectes</option></select></label><button id="phone-toggle" type="button" aria-pressed="false">Mobile · 390px</button></div></div><p class="demo-line">DÉMO STRUCTURELLE · 1 OCTOBRE 2026 · Les noms, dates et comptages sont fictifs. Aucun accès aux données du cabinet.</p><div class="frame" id="app"></div><dialog id="preview-dialog" aria-labelledby="dialog-title"><h2 id="dialog-title"></h2><p id="dialog-body"></p><span class="route" id="dialog-route"></span><button class="action" type="button" data-close>Fermer</button></dialog><script>
const DIRECTION = document.body.dataset.direction;
const params = new URLSearchParams(location.search);
if(params.get('preview')==='1')document.body.classList.add('preview');
const state = { role: params.get('role') === 'collaborator' ? 'collaborator' : 'admin', scope:'cabinet', tab:params.get('tab') || 'overview', day:'2026-10-01', mode:'normal', taskFilter:'open', activityFilter:'Tout' };
const TODAY='2026-10-01';
const societies=[['s1','Carthage Digital','actif','lina'],['s2','Djerba Évasion','actif','lina'],['s3','Sahara Export','actif','lina'],['s4','Nour Distribution','actif','amine'],['s5','Medina Textile','actif','amine'],['s6','Atlas Services','actif','sarra'],['s7','Horizon Conseil','en_attente','sarra']].map(([id,name,status,employee])=>({id,name,status,employee}));
const tasks=[
 ['t1','Révision de la balance','s1','lina','en_cours','2026-09-30T15:00:00'],['t2','Rapprochement bancaire','s4','amine','en_cours','2026-09-29T12:00:00'],['t3','Préparation du dossier annuel','s6','sarra','en_cours','2026-09-28T12:00:00'],['t4','Contrôle des pièces reçues','s5','amine','en_cours','2026-09-27T12:00:00'],['t5','Vérifier les écritures de septembre','s2','lina','a_faire','2026-09-26T12:00:00'],['t6','Préparer les rapprochements','s3','lina','a_faire','2026-09-26T11:00:00'],['t7','Classer les pièces du trimestre','s4','amine','a_faire','2026-09-25T12:00:00'],['t8','Contrôler les comptes fournisseurs','s6','sarra','a_faire','2026-09-25T11:00:00'],['t9','Vérification du grand livre','s1','lina','termine','2026-09-24T12:00:00'],['t10','Classement des justificatifs','s2','lina','termine','2026-09-23T12:00:00'],['t11','Contrôle de cohérence','s5','amine','termine','2026-09-22T12:00:00'],['t12','Révision des comptes clients','s6','sarra','termine','2026-09-21T12:00:00']
].map(([id,title,society,employee,status,updated])=>({id,title,society,employee,status,updated}));
const collections=[['c1','s2','2026-09-25','a_corriger'],['c2','s4','2026-09-30','brouillon'],['c3','s1','2026-10-01','brouillon'],['c4','s3','2026-10-03','transmis'],['c5','s5','2026-10-05','brouillon'],['c6','s6','2026-10-09','a_corriger']].map(([id,society,date,status])=>({id,society,date,status,period:'Septembre 2026'}));
const people={lina:'Lina Ben Salem',amine:'Amine Trabelsi',sarra:'Sarra Mansour'};
const messages={admin:[{name:'Lina Ben Salem',preview:'Les pièces du dossier Carthage sont disponibles.',unread:3},{name:'Amine Trabelsi',preview:'Le rapprochement est prêt pour vérification.',unread:2}],collaborator:[{name:'Cabinet CamConsult',preview:'La balance est disponible pour révision.',unread:2},{name:'Sahara Export',preview:'Les justificatifs ont été déposés.',unread:1}]};
const icons={arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',up:'<path d="M7 17 17 7M7 7h10v10"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',plus:'<path d="M12 5v14M5 12h14"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-2.5 2-2.5 4m0 3h.01"/>',building:'<path d="M5 21V3h14v18M3 21h18M9 7h.01M15 7h.01M9 11h.01M15 11h.01M9 15h.01M15 15h.01M10 21v-3h4v3"/>',tasks:'<path d="m4 6 2 2 3-4m3 2h8m-16 7 2 2 3-4m3 2h8m-16 7 2 2 3-4m3 2h8"/>',files:'<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M9 5V3h6v2M8 10h8M8 14h8M8 18h5"/>',finance:'<rect x="5" y="3" width="14" height="18" rx="1"/><path d="M8 7h8M8 11h2m4 0h2m-8 4h2m4 0h2"/>',message:'<path d="M21 15a3 3 0 0 1-3 3H7l-4 3V6a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3z"/>',journal:'<path d="M6 3h12v18H6zM9 7h6M9 11h6M9 15h4"/>',stock:'<path d="m12 3 9 5v9l-9 5-9-5V8l9-5zm0 9 9-4M12 12 3 8m9 4v10"/>',settings:'<path d="M5 6h14M5 12h14M5 18h14M9 3v6M15 9v6M10 15v6"/>',overview:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>'};
const svg=name=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+icons[name]+'</svg>';
const escapeHTML=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dataset(){const employee=state.role==='collaborator'?'lina':state.scope==='cabinet'?null:state.scope;const s=societies.filter(x=>!employee||x.employee===employee);const allowed=new Set(s.map(x=>x.id));const empty=state.mode==='empty';return{societies:s,tasks:empty?[]:tasks.filter(t=>allowed.has(t.society)&&(!employee||t.employee===employee)).sort((a,b)=>b.updated.localeCompare(a.updated)||a.id.localeCompare(b.id)),collections:empty?[]:collections.filter(c=>allowed.has(c.society)),messages:empty?[]:messages[state.role],employee};}
const company=id=>societies.find(x=>x.id===id)?.name||'Société';
const taskLabel=status=>({a_faire:'À faire',en_cours:'En cours',termine:'Terminée'}[status]);
const dateText=value=>new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'long'}).format(new Date(value+'T12:00:00'));
const collectionLabel=c=>c.status==='transmis'?'Déjà transmis · à examiner':c.status==='a_corriger'?'Corrections demandées':'Transmission attendue';
const destination=(route,text,className='text-link')=>'<a href="'+route+'" data-destination="'+route+'" class="'+className+'">'+text+'</a>';
const sectionHead=(title,link='Tout voir',route='/taches',index='')=>'<div class="section-head">'+(index?'<span class="index">'+index+'</span>':'')+'<h2>'+title+'</h2>'+destination(route,link+svg('arrow'))+'</div>';
function taskRows(rows){return rows.length?'<ul class="work-rows">'+rows.map(t=>'<li><div>'+destination('/taches',escapeHTML(t.title),'row-title row-link')+'<span class="row-meta">'+company(t.society)+(state.role==='admin'?' · '+people[t.employee]:'')+'</span></div><div><span class="state '+(t.status==='termine'?'done':'working')+'">'+taskLabel(t.status)+'</span>'+destination('/taches','<span class="sr-only">Ouvrir '+escapeHTML(t.title)+'</span>'+svg('arrow'))+'</div></li>').join('')+'</ul>':'<p class="empty-state">Aucune tâche dans ce périmètre.</p>';}
function resume(data){const task=data.tasks.find(t=>t.status==='en_cours');return'<div class="resume" data-tour="dashboard-resume">'+(task?'<div class="resume-body"><div><span class="state working">En cours</span><h3>'+escapeHTML(task.title)+'</h3><p class="context">'+company(task.society)+(state.role==='admin'?' · '+people[task.employee]:'')+'</p></div>'+destination('/taches','Reprendre '+svg('arrow'))+'</div>':'<p class="empty-state">Rien à reprendre. Retrouvez les tâches à commencer ci-dessous.</p>')+'</div>';}
function deadlineRows(rows){return'<ul class="deadline-rows">'+rows.map(c=>'<li><time class="deadline-date" datetime="'+c.date+'">'+Number(c.date.slice(8))+'<span>'+new Intl.DateTimeFormat('fr-FR',{month:'short'}).format(new Date(c.date+'T12:00:00'))+'</span></time><div><strong class="row-title">'+company(c.society)+'</strong><span class="row-meta">'+c.period+'</span><span class="state '+(c.status==='a_corriger'?'correct':'working')+'">'+collectionLabel(c)+'</span></div>'+destination('/collectes/'+c.id,'<span class="action-text">Ouvrir</span><span class="sr-only"> '+company(c.society)+'</span>'+svg('arrow'))+'</li>').join('')+'</ul>';}
function dates(data){return'<div class="agenda-range">1–6 octobre 2026 · dates limites des collectes</div><div class="date-rail" role="group" aria-label="Choisir une date de collecte" data-tour="dashboard-deadline-strip">'+Array.from({length:6},(_,i)=>{const day='2026-10-0'+(i+1),count=data.collections.filter(c=>c.date===day).length;return'<button class="day" type="button" data-day="'+day+'" aria-pressed="'+(state.day===day)+'" aria-label="'+dateText(day)+', '+count+' collecte'+(count>1?'s':'')+'"><span class="dow">'+(i===0?'Aujourd’hui':new Intl.DateTimeFormat('fr-FR',{weekday:'short'}).format(new Date(day+'T12:00:00')))+'</span><span class="date">'+(i+1)+'</span><span class="count '+(!count?'empty':'')+'">'+(count?count+' collecte'+(count>1?'s':''):'—')+'</span></button>';}).join('')+'</div>';}
function selected(data){const due=data.collections.filter(c=>c.date===state.day);return'<div class="selected-day" aria-live="polite"><div class="selected-label"><h3>'+(state.day===TODAY?'Aujourd’hui':dateText(state.day))+'</h3><span>'+due.length+' collecte'+(due.length>1?'s':'')+'</span></div>'+(due.length?deadlineRows(due):'<p class="empty-copy">Aucune transmission prévue'+(state.day===TODAY?' aujourd’hui':' ce jour')+'.</p>')+'</div>';}
function upcoming(data){const next=data.collections.filter(c=>c.date>state.day).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,2);return'<div class="upcoming"><h3 class="upcoming-title">Prochaines dates</h3>'+(next.length?deadlineRows(next):'<p class="empty-state">Aucune prochaine échéance dans ce périmètre.</p>')+'</div>';}
const failure=()=>state.mode==='error'?'<p class="source-error" role="status">Collectes indisponibles. Les échéances n’ont pas pu être chargées. Les tâches et messages restent accessibles.</p>':state.mode==='loading'?'<p class="source-loading" role="status">Chargement des échéances de collecte…</p>':null;
function agenda(data,editorial=false){const pending=failure();const content=pending||dates(data)+(editorial?'<div class="selected-and-next">'+selected(data)+upcoming(data)+'</div>':selected(data)+upcoming(data));return'<div class="agenda" data-tour="dashboard-transmissions">'+(editorial?'':sectionHead('Transmissions de collecte','Échéances','/?tab=deadlines')+'<p class="explanation">Dates limites des collectes uniquement.<br>Les tâches n’ont pas d’échéance.</p>')+content+'</div>';}
function attentionRows(data,full=false){const entries=data.collections.filter(c=>c.date<TODAY||c.status==='a_corriger'||c.status==='transmis').sort((a,b)=>a.date.localeCompare(b.date));return'<ul class="mini-rows">'+entries.slice(0,full?entries.length:3).map(c=>'<li>'+destination('/collectes/'+c.id,'<span class="state '+(c.date<TODAY?'alert':c.status==='a_corriger'?'correct':'working')+'">'+(c.date<TODAY?'Échéance dépassée · '+dateText(c.date):collectionLabel(c))+'</span><strong>'+company(c.society)+'</strong><span class="row-meta">Collecte · '+c.period+'</span>','')+'</li>').join('')+'</ul>'+(entries.length?'':'<p class="empty-state">Aucune collecte à traiter dans ce périmètre.</p>');}
function attention(data){return sectionHead('À traiter','Tout voir','/?tab=attention')+(failure()?'<p class="source-error" role="status">Suivi des collectes indisponible.</p>':attentionRows(data));}
function communication(data){return sectionHead('Mes messages non lus','Messagerie','/messagerie')+(data.messages.length?'<ul class="mini-rows">'+data.messages.map(m=>'<li>'+destination('/messagerie','<span class="quiet">'+m.unread+' non lu'+(m.unread>1?'s':'')+'</span><strong>'+m.name+'</strong><span class="row-meta">'+m.preview+'</span>','')+'</li>').join('')+'</ul>':'<p class="empty-state">Aucun message non lu.</p>')+(state.role==='admin'?'<div class="team-link">'+destination('/?tab=team','Répartition du travail de l’équipe '+svg('arrow'))+'</div>':'');}
function current(data){const resumeTask=data.tasks.find(t=>t.status==='en_cours');return taskRows(data.tasks.filter(t=>t.status==='en_cours'&&t.id!==resumeTask?.id).slice(0,3));}
function start(data){return taskRows(data.tasks.filter(t=>t.status==='a_faire').slice(0,3));}
function bureau(data){if(DIRECTION==='a')return'<div class="folio-grid"><section class="folio-entry folio-resume" data-section="01">'+sectionHead('Reprendre le travail','Tâches','/taches')+resume(data)+'</section><section class="folio-entry folio-agenda" data-section="02">'+agenda(data)+'</section><section class="folio-entry folio-current" data-section="03" data-tour="dashboard-tasks">'+sectionHead('Travail en cours')+current(data)+'</section><section class="folio-entry folio-start" data-section="04">'+sectionHead('Tâches à commencer')+start(data)+'</section><aside class="margin-note note-attention" data-tour="dashboard-attention">'+attention(data)+'</aside><aside class="margin-note note-messages" data-tour="dashboard-communication">'+communication(data)+'</aside></div>';
 if(DIRECTION==='b')return'<div class="desk-grid"><section class="desk-resume">'+sectionHead('Reprendre le travail','Tâches','/taches')+resume(data)+'</section><section class="desk-agenda">'+agenda(data)+'</section><section class="desk-current" data-tour="dashboard-tasks">'+sectionHead('Travail en cours')+current(data)+'</section><section class="desk-start">'+sectionHead('Tâches à commencer')+start(data)+'</section><aside class="desk-attention" data-tour="dashboard-attention">'+attention(data)+'</aside><aside class="desk-messages" data-tour="dashboard-communication">'+communication(data)+'</aside></div>';
 return'<div class="editorial-bureau"><section class="editorial-resume"><span class="editorial-index" aria-hidden="true">01</span><div>'+sectionHead('Reprendre le travail','Tâches','/taches')+resume(data)+'</div></section><section class="editorial-agenda"><div class="agenda-side"><span class="editorial-index" aria-hidden="true">02</span><h2>Transmissions de collecte</h2><p>Dates limites des collectes uniquement. Les tâches n’ont pas d’échéance.</p></div>'+agenda(data,true)+'</section><div class="editorial-work" data-tour="dashboard-tasks"><section>'+sectionHead('Travail en cours','Tâches','/taches','03')+current(data)+'</section><section>'+sectionHead('Tâches à commencer','Tâches','/taches','04')+start(data)+'</section></div><div class="editorial-notes"><section data-tour="dashboard-attention">'+attention(data)+'</section><section data-tour="dashboard-communication">'+communication(data)+'</section></div></div>';}
function metrics(data){const unread=data.messages.reduce((sum,m)=>sum+m.unread,0),overdue=data.collections.filter(c=>c.date<TODAY).length;const items=[['clients',state.role==='admin'?'Clients actifs':'Mes sociétés',state.role==='admin'?data.societies.filter(s=>s.status==='actif').length:data.societies.length,'/societes','Dans votre périmètre'],['tasks','Tâches ouvertes',data.tasks.filter(t=>t.status!=='termine').length,'/taches','À faire et en cours'],['messages','Messages non lus',unread,'/messagerie','Votre compte uniquement'],['overdue','Échéances en retard',overdue,'/?tab=deadlines','Collectes uniquement']];if(DIRECTION==='b')items.unshift(items.splice(1,1)[0]);return'<nav class="metrics" aria-label="Indicateurs et accès aux modules">'+items.map(([id,label,value,route,note])=>{const unavailable=id==='overdue'&&state.mode!=='normal'&&state.mode!=='empty';return'<button type="button" class="metric metric-'+id+(!unavailable&&id==='overdue'&&value>0?' red':'')+'" '+(unavailable?'disabled':'data-metric="'+route+'"')+' aria-label="'+label+' : '+(unavailable?'indisponible':value)+'"><span class="metric-value">'+(unavailable?'—':value)+'</span><span class="metric-label">'+label+'</span><span class="metric-note">'+(unavailable?state.mode==='loading'?'Chargement…':'Indisponible':note)+'</span></button>';}).join('')+'</nav>';}
const tabNames={overview:'Mon bureau',tasks:'Tâches',attention:'À traiter',deadlines:'Échéances',team:'Équipe',activity:'Activité'};
function tabs(){const keys=Object.keys(tabNames).filter(key=>state.role==='admin'||key!=='team');if(!keys.includes(state.tab))state.tab='overview';return'<div class="tabs" role="tablist" aria-label="Vues du Dashboard" data-tour="dashboard-tabs">'+keys.map(key=>'<button type="button" role="tab" id="tab-'+key+'" aria-controls="workspace-panel" aria-selected="'+(state.tab===key)+'" tabindex="'+(state.tab===key?'0':'-1')+'" data-tab="'+key+'">'+tabNames[key]+'</button>').join('')+'</div>';}
function scope(){return'<div class="controls"><div class="scope" data-tour="dashboard-scope">'+(state.role==='admin'?'<label for="scope-select">Périmètre de travail</label><select id="scope-select" aria-label="Périmètre de travail"><option value="cabinet">Tout le cabinet</option>'+Object.entries(people).map(([id,name])=>'<option value="'+id+'" '+(state.scope===id?'selected':'')+'>'+name+'</option>').join('')+'</select><span class="tiny muted">Messages : votre compte</span>':'<p class="personal"><strong>Mon travail</strong> Vos sociétés et tâches attribuées.</p>')+'</div><button type="button" class="view-help" data-help>Aide</button></div>';}
function second(data){const names={deadlines:'Échéances des collectes',tasks:'Tâches',attention:'À traiter',team:'Répartition du travail',activity:'Activité récente'};const description={deadlines:'Dates limites de transmission des collectes. Les tâches n’ont pas d’échéance.',tasks:'Travail dans le périmètre sélectionné, sans dates limites.',attention:'Collectes à examiner et échanges qui demandent votre attention.',team:'Comptages de tâches par collaborateur. Aucune mesure de capacité ou de performance.',activity:'Un aperçu récent des éléments accessibles, pas un historique complet.'};let content='';if(state.tab==='deadlines'){const pending=failure();const groups=[['En retard',c=>c.date<TODAY],['Aujourd’hui',c=>c.date===TODAY],['7 prochains jours',c=>c.date>TODAY&&c.date<='2026-10-08'],['Plus tard',c=>c.date>'2026-10-08']];content=pending||groups.map(([name,filter])=>{const rows=data.collections.filter(filter).sort((a,b)=>a.date.localeCompare(b.date));return rows.length?'<section class="deadline-group"><h3 class="'+(name==='En retard'?'red':'')+'">'+name+'<span>'+rows.length+' collecte'+(rows.length>1?'s':'')+'</span></h3>'+deadlineRows(rows)+'</section>':'';}).join('')||'<p class="empty-state">Aucune échéance de collecte dans ce périmètre.</p>';}
 if(state.tab==='tasks'){const rows=data.tasks.filter(t=>state.taskFilter==='open'?t.status!=='termine':t.status==='termine');content='<div class="filter-bar" role="group" aria-label="État des tâches"><button data-task-filter="open" aria-pressed="'+(state.taskFilter==='open')+'">Ouvertes '+data.tasks.filter(t=>t.status!=='termine').length+'</button><button data-task-filter="done" aria-pressed="'+(state.taskFilter==='done')+'">Terminées '+data.tasks.filter(t=>t.status==='termine').length+'</button></div>'+taskRows(rows);}
 if(state.tab==='attention'){content=(failure()?'<p class="source-error" role="status">Les collectes ne sont pas chargées. La communication reste disponible.</p>':attentionRows(data,true))+'<h3 class="subhead">Communication</h3>'+communication(data);}
 if(state.tab==='team'){const ids=data.employee?[data.employee]:Object.keys(people);const counts=id=>{const rows=data.tasks.filter(t=>t.employee===id);return[rows.filter(t=>t.status==='a_faire').length,rows.filter(t=>t.status==='en_cours').length,rows.filter(t=>t.status==='termine').length,rows.filter(t=>t.status!=='termine').length];};content='<table class="team-table"><caption class="sr-only">Tâches par collaborateur</caption><thead><tr>'+['Collaborateur','À faire','En cours','Terminées','Ouvertes'].map(label=>'<th scope="col">'+label+'</th>').join('')+'</tr></thead><tbody>'+ids.map(id=>'<tr><td>'+people[id]+'</td>'+counts(id).map(count=>'<td>'+count+'</td>').join('')+'</tr>').join('')+'</tbody></table><ul class="team-mobile">'+ids.map(id=>'<li><h3>'+people[id]+'</h3><dl>'+['À faire','En cours','Terminées','Ouvertes'].map((label,i)=>'<div><dt>'+label+'</dt><dd>'+counts(id)[i]+'</dd></div>').join('')+'</dl></li>').join('')+'</ul>';}
 if(state.tab==='activity'){const filters=['Tout','Fichier','Message',...(state.role==='admin'?['Journal']:[])];if(!filters.includes(state.activityFilter))state.activityFilter='Tout';const events=[{type:'Fichier',title:'Balance septembre.xlsx',text:company(data.societies[0].id)+' · fichier mis à jour',time:'Hier · 15:20'},...data.messages.slice(0,1).map(m=>({type:'Message',title:m.name,text:m.preview,time:'Hier · 14:10'})),...(state.role==='admin'?[{type:'Journal',title:'Mohamed Ayedi',text:'Modification d’une société dans le cabinet',time:'Hier · 11:05'}]:[])];content='<div class="filter-bar" role="group" aria-label="Sources de l’activité">'+filters.map(f=>'<button data-activity-filter="'+f+'" aria-pressed="'+(state.activityFilter===f)+'">'+f+'</button>').join('')+'</div><h3 class="subhead">Hier</h3>'+events.filter(e=>state.activityFilter==='Tout'||e.type===state.activityFilter).map(e=>'<div class="activity-item"><div><strong>'+e.title+'</strong><span class="activity-type">'+e.type+'</span><p>'+e.text+'</p></div><time>'+e.time+'</time></div>').join('');}
 return'<section class="secondary-scene" data-section="'+(state.tab==='deadlines'?'02':state.tab==='tasks'?'03':state.tab==='attention'?'05':state.tab==='team'?'06':'07')+'"><header class="secondary-head"><div><h2>'+names[state.tab]+'</h2><p>'+description[state.tab]+'</p></div>'+destination(state.tab==='deadlines'?'/collectes':state.tab==='tasks'?'/taches':state.tab==='team'?'/employes':state.tab==='activity'?'/structuration':'/collectes','Ouvrir le module '+svg('arrow'))+'</header>'+content+'</section>';}
function command(){return'<header class="command" data-tour="dashboard-summary"><div class="identity"><time datetime="2026-10-01"><strong>01</strong><span>octobre 2026</span></time><div><p class="greeting">Bonjour '+(state.role==='admin'?'Mohamed':'Lina')+' · jeudi 1 octobre</p><h1>'+(state.role==='admin'?'Le travail du cabinet':'Mon espace de travail')+'</h1><p class="quiet">Reprendre, avancer, préparer les transmissions.</p></div></div><button type="button" class="action inverse" data-quick data-tour="dashboard-quick-actions">'+svg('plus')+'<span class="desktop-label">Actions rapides</span><span class="sr-only">Actions rapides</span></button></header>';}
function sidebar(){return'<aside class="sidebar"><div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>CAMCONSULT</div><small>Overview</small>'+destination('/',''+svg('overview')+'Dashboard','active')+'<small>Clients & travail</small>'+[['/societes','building','Sociétés'],['/taches','tasks','Tâches'],['/collectes','files','Collecte de pièces'],['/stock','stock','Gestion de stock']].map(([r,i,n])=>destination(r,svg(i)+n,'')).join('')+'<small>Comptabilité</small>'+destination('/etats-financiers',svg('finance')+'États financiers','')+destination('/structuration',svg('files')+'Structuration','')+'<small>Organisation</small>'+destination('/messagerie',svg('message')+'Messagerie','')+(state.role==='admin'?'<small>Administration</small>'+destination('/journal',svg('journal')+'Journal','')+destination('/parametres',svg('settings')+'Paramètres',''):'')+'</aside>';}
function render(){const data=dataset();const wrapper=DIRECTION==='a'?'folio':DIRECTION==='b'?'desk':'sheet';document.getElementById('app').innerHTML='<div class="shell">'+sidebar()+'<div class="page-wrap"><div class="topbar"><div class="topbar-left"><button aria-label="Navigation de l’application — aperçu" data-menu>'+svg('menu')+'</button><strong>Dashboard</strong></div><div class="profile"><div class="avatar">'+(state.role==='admin'?'MA':'LB')+'</div><div class="person"><strong>'+(state.role==='admin'?'Mohamed Ayedi':'Lina Ben Salem')+'</strong><br><span>'+(state.role==='admin'?'Administrateur':'Collaboratrice')+'</span></div></div></div><main class="page" data-tour="page-workspace">'+command()+'<div class="'+wrapper+'">'+metrics(data)+scope()+tabs()+'<div class="workspace" id="workspace-panel" role="tabpanel" tabindex="0" aria-labelledby="tab-'+state.tab+'">'+(state.tab==='overview'?bureau(data):second(data))+'</div><footer class="footer"><span>Démo structurelle · données fictives · aucune action réelle</span><span class="registration"><i aria-hidden="true"></i> CamConsult / Daily Workspace</span></footer></div></main></div></div>';document.getElementById('review-role').value=state.role;}
const modal=document.getElementById('preview-dialog');let returnFocus=null;
function show(title,body,route=''){returnFocus=document.activeElement;document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-body').textContent=body;document.getElementById('dialog-route').textContent=route;modal.showModal();}
document.addEventListener('click',e=>{const destinationLink=e.target.closest('[data-destination]');if(destinationLink){e.preventDefault();const route=destinationLink.dataset.destination;if(route.startsWith('/?tab=')){state.tab=route.split('=')[1];render();document.getElementById('tab-'+state.tab)?.focus();}else show('Destination de démonstration','Ce lien ouvrirait le module indiqué. Cette maquette ne se connecte pas à l’application.',route);return;}
const tab=e.target.closest('[data-tab]');if(tab){state.tab=tab.dataset.tab;render();document.getElementById('tab-'+state.tab)?.focus();return;}
const day=e.target.closest('[data-day]');if(day){state.day=day.dataset.day;const previousScroll=day.closest('.date-rail').scrollLeft;render();const selectedDay=document.querySelector('[data-day="'+state.day+'"]');selectedDay.focus({preventScroll:true});selectedDay.closest('.date-rail').scrollLeft=previousScroll;return;}
const metric=e.target.closest('[data-metric]');if(metric){if(metric.dataset.metric.startsWith('/?tab=')){state.tab='deadlines';render();document.getElementById('tab-deadlines').focus();}else show('Accès au module','Le nombre conserve son sens et mène au module existant.',metric.dataset.metric);return;}
const taskFilter=e.target.closest('[data-task-filter]');if(taskFilter){state.taskFilter=taskFilter.dataset.taskFilter;render();document.querySelector('[data-task-filter="'+state.taskFilter+'"]').focus();return;}
const activityFilter=e.target.closest('[data-activity-filter]');if(activityFilter){state.activityFilter=activityFilter.dataset.activityFilter;render();document.querySelector('[data-activity-filter="'+state.activityFilter+'"]').focus();return;}
if(e.target.closest('[data-quick]'))show('Actions rapides','Les créations restent dans leurs modules : Tâches, Collecte de pièces'+(state.role==='admin'?', Sociétés':'')+' et Messagerie. Aucun enregistrement n’est créé dans cette maquette.');
if(e.target.closest('[data-help]'))show('Comprendre cette page','Reprendre ouvre une tâche en cours. Les dates concernent uniquement les collectes. Les messages restent ceux de votre compte, même quand le périmètre change. La visite guidée existante serait réutilisée lors de l’implémentation.');
if(e.target.closest('[data-menu]'))show('Navigation de l’application','Le menu latéral reprend les modules autorisés pour le rôle sélectionné. Aucun changement de navigation de production n’est proposé.');
if(e.target.closest('[data-close]'))modal.close();});
document.addEventListener('change',e=>{if(e.target.id==='review-role'){state.role=e.target.value;state.scope='cabinet';render();}if(e.target.id==='review-state'){state.mode=e.target.value;render();}if(e.target.id==='scope-select'){state.scope=e.target.value;render();}});
document.addEventListener('keydown',e=>{const active=e.target.closest('[role="tab"]');if(!active||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const keys=Object.keys(tabNames).filter(k=>state.role==='admin'||k!=='team'),index=keys.indexOf(state.tab);state.tab=e.key==='Home'?keys[0]:e.key==='End'?keys.at(-1):keys[(index+(e.key==='ArrowRight'?1:-1)+keys.length)%keys.length];render();document.getElementById('tab-'+state.tab).focus();});
modal.addEventListener('close',()=>returnFocus?.focus());
document.getElementById('phone-toggle').addEventListener('click',e=>{const frame=document.getElementById('app');frame.classList.toggle('phone');e.currentTarget.setAttribute('aria-pressed',String(frame.classList.contains('phone')));});
if(params.get('mobile')==='1'){document.getElementById('app').classList.add('phone');document.getElementById('phone-toggle').setAttribute('aria-pressed','true');}render();
</script></body></html>
