name: Build & push camconsult-site

on:
  push:
    branches: [main]
    paths:
      - "camconsult/**"
      - ".github/workflows/camconsult-site.yml"
  workflow_dispatch: {}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./camconsult
          push: true
          build-args: |
            NEXT_PUBLIC_CLIENT_PORTAL_URL=https://cabinet.camconsult.com.tn/login
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/camconsult-site:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/camconsult-site:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
