# /etc/nginx/sites-available/camconsult.com.tn
# Puis :  ln -s /etc/nginx/sites-available/camconsult.com.tn /etc/nginx/sites-enabled/
#         nginx -t && systemctl reload nginx
# (Certbot ajoutera automatiquement les blocs HTTPS 443 + les redirections.)
#
# Routage du domaine — plusieurs applications séparées, un seul VPS. Nginx
# tourne sur l'hôte (apt) ; les apps tournent en conteneurs Docker (voir
# docker-compose.yml dans ce même dossier — images tirées de Docker Hub,
# mises à jour automatiquement par Watchtower) :
#   camconsult.com.tn / www   → conteneur "camconsult-site" (Next.js), :3000
#   cabinet.camconsult.com.tn → conteneur "app-comptable", :5181
#   monitor.camconsult.com.tn → conteneur "dozzle" (monitoring), :8082

server {
    listen 80;
    listen [::]:80;
    server_name camconsult.com.tn www.camconsult.com.tn;

    access_log /var/log/nginx/camconsult-site.access.log;
    error_log  /var/log/nginx/camconsult-site.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name cabinet.camconsult.com.tn;

    # Import de fichiers (dataUrl base64 ≤ 2 Mo + marge)
    client_max_body_size 15M;

    access_log /var/log/nginx/app-comptable.access.log;
    error_log  /var/log/nginx/app-comptable.error.log;

    # OCR (module Stock) : rastérisation + reconnaissance de plusieurs pages,
    # avec une repasse en haute résolution possible pour une déclaration
    # douanière — peut dépasser largement 60s sur un document dense (constaté
    # en usage réel : 504 Gateway Timeout côté nginx alors que l'extraction
    # elle-même aboutissait). Délai propre à ces deux routes seulement — le
    # reste de l'appli garde un délai normal de 60s.
    location ~ ^/api/stock/(extract|extract-pages)$ {
        proxy_pass http://127.0.0.1:5181;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Messagerie/notifications en direct (Server-Sent Events) : connexion
    # longue durée, jamais mise en tampon par nginx (sinon les événements
    # n'arrivent qu'en rafale, à la fermeture de la connexion).
    location = /api/events {
        proxy_pass http://127.0.0.1:5181;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:5181;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name monitor.camconsult.com.tn;

    access_log /var/log/nginx/dozzle.access.log;
    error_log  /var/log/nginx/dozzle.error.log;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        # Dozzle pousse les logs/métriques en direct via SSE — connexion
        # longue durée, jamais mise en tampon par nginx.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
